name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: git SHA)'
        required: false
        type: string

env:
  GHCR_ORG: radicalrad
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  COMPOSE_FILE: deploy/podman-compose.prod.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: builder
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_ORG }}/open-mercato-app:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.GHCR_ORG }}/open-mercato-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ env.GHCR_ORG }}/open-mercato-app:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.GHCR_ORG }}/open-mercato-app:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/open-mercato
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GHCR_ORG=${{ env.GHCR_ORG }}
            
            # Pull new image
            podman pull ghcr.io/${GHCR_ORG}/open-mercato-app:${IMAGE_TAG}
            
            # Backup current state
            ./scripts/backup-postgres.sh || true
            
            # Deploy
            podman-compose -f deploy/podman-compose.prod.yml up -d --remove-orphans
            
            # Wait for health check
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "App is healthy!"
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after 5 minutes"
            exit 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, security-scan, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/open-mercato
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GHCR_ORG=${{ env.GHCR_ORG }}
            
            # Pull new image
            podman pull ghcr.io/${GHCR_ORG}/open-mercato-app:${IMAGE_TAG}
            
            # Backup current state
            ./scripts/backup-postgres.sh
            ./scripts/backup-storage.sh
            
            # Deploy
            podman-compose -f deploy/podman-compose.prod.yml up -d --remove-orphans
            
            # Wait for health check
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "App is healthy!"
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed after 5 minutes"
            exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful"
          echo "Image: ghcr.io/${{ env.GHCR_ORG }}/open-mercato-app:${{ env.IMAGE_TAG }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed"
          echo "Manual rollback may be required"
