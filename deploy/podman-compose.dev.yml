# Open Mercato - Local Development with Podman (from source)
# Usage: podman-compose -f deploy/podman-compose.dev.yml up --build -d
#
# Builds the app container from source using the dev Dockerfile target.
# Source is bind-mounted so changes are reflected live.

services:
  postgres:
    env_file:
      - .env
    image: pgvector/pgvector:pg17-trixie
    container_name: om-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open-mercato}
    volumes:
      - om-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - om-internal

  redis:
    image: redis:7-alpine
    container_name: om-redis-dev
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - om-redis-dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - om-internal

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: om-meilisearch-dev
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - om-meilisearch-dev:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - om-internal

  app:
    build:
      context: ..
      target: dev
    image: open-mercato/dev:local
    container_name: om-app-dev
    user: "0"
    command: ["/bin/sh", "/app/docker/scripts/dev-entrypoint.sh"]
    volumes:
      - ../:/app
      - om-app-node-modules:/app/node_modules
      - om-app-next:/app/apps/mercato/.next
      - om-init-marker:/tmp/init-marker
      - om-attachments:/app/apps/mercato/storage
      # Exclude package dist dirs so container builds own output
      - om-pkg-core-dist:/app/packages/core/dist
      - om-pkg-shared-dist:/app/packages/shared/dist
      - om-pkg-ui-dist:/app/packages/ui/dist
      - om-pkg-cli-dist:/app/packages/cli/dist
      - om-pkg-cache-dist:/app/packages/cache/dist
      - om-pkg-content-dist:/app/packages/content/dist
      - om-pkg-checkout-dist:/app/packages/checkout/dist
      - om-pkg-events-dist:/app/packages/events/dist
      - om-pkg-onboarding-dist:/app/packages/onboarding/dist
      - om-pkg-queue-dist:/app/packages/queue/dist
      - om-pkg-search-dist:/app/packages/search/dist
      - om-pkg-scheduler-dist:/app/packages/scheduler/dist
      - om-pkg-ai-assistant-dist:/app/packages/ai-assistant/dist
      - om-pkg-create-app-dist:/app/packages/create-app/dist
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      OM_DEV_SPLASH_PORT: "4000"
      OM_DEV_INOTIFY_CHECK: "skip"
      REDIS_URL: redis://om-redis-dev:6379
      QUEUE_REDIS_URL: redis://om-redis-dev:6379
      TENANT_DATA_ENCRYPTION: ${TENANT_DATA_ENCRYPTION:-true}
      TENANT_DATA_ENCRYPTION_DEBUG: ${TENANT_DATA_ENCRYPTION_DEBUG:-false}
      TENANT_DATA_ENCRYPTION_FALLBACK_KEY: ${TENANT_DATA_ENCRYPTION_FALLBACK_KEY:-dev-tenant-encryption-fallback-key-32chars}
      NODE_ENV: development
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
      DEPLOY_ENV: local
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@om-postgres-dev:5432/${POSTGRES_DB:-open-mercato}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      CACHE_REDIS_URL: redis://om-redis-dev:6379
      CACHE_STRATEGY: redis
      ENABLE_CRUD_API_CACHE: ${ENABLE_CRUD_API_CACHE:-true}
      OM_AI_PROVIDER: ${OM_AI_PROVIDER:-openai}
      OM_AI_MODEL: ${OM_AI_MODEL:-gpt-5-mini}
      OPENCODE_PROVIDER: ${OPENCODE_PROVIDER:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      MEILISEARCH_HOST: http://om-meilisearch-dev:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_MASTER_KEY:-meilisearch-dev-key}
      NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED: ${NEXT_PUBLIC_UPGRADE_ACTIONS_ENABLED:-true}
      UPGRADE_ACTIONS_ENABLED: ${UPGRADE_ACTIONS_ENABLED:-true}
      SELF_SERVICE_ONBOARDING_ENABLED: ${SELF_SERVICE_ONBOARDING_ENABLED:-true}
      DEMO_MODE: ${DEMO_MODE:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      OM_INIT_SUPERADMIN_EMAIL: ${OM_INIT_SUPERADMIN_EMAIL:-superadmin@acme.com}
      OM_INIT_SUPERADMIN_PASSWORD: ${OM_INIT_SUPERADMIN_PASSWORD:?OM_INIT_SUPERADMIN_PASSWORD is required in .env}
      TENANT_DATA_ENCRYPTION_KEY: ${TENANT_DATA_ENCRYPTION_KEY:-}
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - om-internal

volumes:
  om-postgres-dev:
    name: om-postgres-dev
  om-redis-dev:
    name: om-redis-dev
  om-meilisearch-dev:
    name: om-meilisearch-dev
  om-init-marker:
    name: om-init-marker-dev
  om-attachments:
    name: om-attachments-dev
  om-app-node-modules:
    name: om-app-node-modules-dev
  om-app-next:
    name: om-app-next-dev
  om-pkg-core-dist:
    name: om-pkg-core-dist-dev
  om-pkg-shared-dist:
    name: om-pkg-shared-dist-dev
  om-pkg-ui-dist:
    name: om-pkg-ui-dist-dev
  om-pkg-cli-dist:
    name: om-pkg-cli-dist-dev
  om-pkg-cache-dist:
    name: om-pkg-cache-dist-dev
  om-pkg-content-dist:
    name: om-pkg-content-dist-dev
  om-pkg-checkout-dist:
    name: om-pkg-checkout-dist-dev
  om-pkg-events-dist:
    name: om-pkg-events-dist-dev
  om-pkg-onboarding-dist:
    name: om-pkg-onboarding-dist-dev
  om-pkg-queue-dist:
    name: om-pkg-queue-dist-dev
  om-pkg-search-dist:
    name: om-pkg-search-dist-dev
  om-pkg-scheduler-dist:
    name: om-pkg-scheduler-dist-dev
  om-pkg-ai-assistant-dist:
    name: om-pkg-ai-assistant-dist-dev
  om-pkg-create-app-dist:
    name: om-pkg-create-app-dist-dev

networks:
  om-internal:
    name: om-internal-dev
    driver: bridge
